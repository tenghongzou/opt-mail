name = "opt-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ── D1 資料庫 ──────────────────────────────────────────────
# 先跑：npx wrangler d1 create opt-mail-db
# 再把回傳的 database_id 貼到下面
[[d1_databases]]
binding = "DB"
database_name = "opt-mail-db"
database_id = "REPLACE_ME_AFTER_D1_CREATE"

# ── 一般設定（非機密，可直接寫這）────────────────────────────
[vars]
# 選用：首次啟動建立第一個管理員時，順便把這個網域建進 domains（方便遷移）。
# 之後網域一律在 Dashboard 管理，可加多個；catch-all 也改為「每個網域各自」設定。
MAIL_DOMAIN = "example.com"

# ── M2 回信 ─────────────────────────────────────────────────
# 每個別名每日出站上限（防濫用）。留空預設 50。
OUTBOUND_DAILY_LIMIT = "50"

# ── M3 AI 加值 ──────────────────────────────────────────────
# 進站信分析用模型。留空預設 claude-opus-5；想省錢可改 "claude-haiku-4-5"。
AI_MODEL = "claude-opus-5"

# ── 機密（不要寫在這，用 wrangler secret put 設定）──────────────
# 首次登入用的 bootstrap 管理員帳密（第一次登入即建立第一個管理員）：
# npx wrangler secret put DASHBOARD_USER
# npx wrangler secret put DASHBOARD_PASS
# 簽 session cookie 的密鑰（正式環境務必設定；未設會退回用 DASHBOARD_PASS）：
# npx wrangler secret put SESSION_SECRET
# M2 回信需要（同時要在 Resend 驗證你要寄件的網域）：
# npx wrangler secret put RESEND_API_KEY
# M3 AI 分析需要：
# npx wrangler secret put ANTHROPIC_API_KEY
# 本機開發時放在 .dev.vars（見 .dev.vars.example）
